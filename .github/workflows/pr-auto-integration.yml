name: PR Branch Preparation

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Activer la fusion automatique
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Attendre les contrôles requis puis fusionner
        uses: actions/github-script@v8
        with:
          script: |
            const pull = context.payload.pull_request;
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    id
                    autoMergeRequest { enabledAt }
                  }
                }
              }
            `;
            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pull.number,
            });
            const pullRequest = result.repository.pullRequest;

            if (pullRequest.autoMergeRequest) {
              core.info('La fusion automatique est déjà activée.');
              return;
            }

            await github.graphql(`
              mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { number }
                }
              }
            `, { pullRequestId: pullRequest.id });
            core.info('Fusion automatique activée : GitHub attend les contrôles requis.');
