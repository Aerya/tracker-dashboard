name: PR Auto Integration

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare internal pull request
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Update branch and enable auto-merge
        uses: actions/github-script@v8
        with:
          script: |
            const pull = context.payload.pull_request;

            try {
              await github.rest.pulls.updateBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                expected_head_sha: pull.head.sha,
              });
              core.info('Pull request branch update requested.');
            } catch (error) {
              if (error.status !== 422) throw error;
              core.info('Pull request branch is already up to date.');
            }

            if (!pull.auto_merge) {
              await github.graphql(`
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId
                    mergeMethod: SQUASH
                  }) {
                    pullRequest { number }
                  }
                }
              `, { pullRequestId: pull.node_id });
              core.info('Auto-merge enabled; required checks remain authoritative.');
            } else {
              core.info('Auto-merge is already enabled.');
            }
