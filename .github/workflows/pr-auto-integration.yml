name: PR Branch Preparation

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Activer la fusion automatique
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Attendre les contrôles requis puis fusionner
        uses: actions/github-script@v8
        with:
          script: |
            const pull = context.payload.pull_request;
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    id
                    autoMergeRequest { enabledAt }
                  }
                }
              }
            `;
            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pull.number,
            });
            const pullRequest = result.repository.pullRequest;

            if (pullRequest.autoMergeRequest) {
              core.info('La fusion automatique est déjà activée.');
              return;
            }

            await github.graphql(`
              mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { number }
                }
              }
            `, { pullRequestId: pullRequest.id });
            core.info('Fusion automatique activée : GitHub attend les contrôles requis.');

  publish-after-auto-merge:
    name: Publier les images après fusion
    needs: enable-auto-merge
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Attendre la fusion puis déclencher la publication
        uses: actions/github-script@v8
        with:
          script: |
            const number = context.payload.pull_request.number;
            const pause = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

            for (let attempt = 1; attempt <= 80; attempt += 1) {
              const { data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });

              if (pull.merged_at) {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'docker-publish.yml',
                  ref: 'main',
                });
                core.info(`PR #${number} fusionnée : publication Docker déclenchée sur main.`);
                return;
              }

              if (pull.state === 'closed') {
                core.info(`PR #${number} fermée sans fusion : aucune publication.`);
                return;
              }

              core.info(`PR #${number} encore ouverte (${attempt}/80), nouvelle vérification dans 15 s.`);
              await pause(15_000);
            }

            core.setFailed(`La PR #${number} n'a pas été fusionnée dans le délai de 20 minutes.`);
