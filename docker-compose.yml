services:
  tracker-dashboard:
    image: ghcr.io/tracker-dashboard/tracker-dashboard:latest
    container_name: tracker-dashboard
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Token pour proteger l'endpoint /metrics (Prometheus)
      # Laisser vide ou retirer la ligne pour desactiver l'export (l'endpoint renverra une erreur 503)
      METRICS_TOKEN: ""
      # Pour un test ponctuel sans token : METRICS_PUBLIC=true
      # Ne pas laisser actif si l'instance est exposee hors reseau local.
      # METRICS_PUBLIC: "true"
    volumes:
      - ./config:/app/config

  tracker-dashboard-flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: tracker-dashboard-flaresolverr
    restart: unless-stopped
    network_mode: "service:tracker-dashboard"
    environment:
      HOST: 127.0.0.1
      # Evite de journaliser les corps de requete, qui contiennent les cookies de session.
      LOG_LEVEL: warning
      TZ: Europe/Paris

  tracker-dashboard-trawl:
    image: ghcr.io/germondai/trawl:baseline
    container_name: tracker-dashboard-trawl
    restart: unless-stopped
    network_mode: "service:tracker-dashboard"
    environment:
      PORT: 8192
      LOG_LEVEL: warning
      TZ: Europe/Paris
